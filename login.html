<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生登录 · 法语通关</title><link rel="stylesheet" href="/account.css"><header><a href="/">法语通关</a></header><main><section class="account-card"><h1 id="title">学生登录</h1><p>使用老师提供的邮箱和密码。</p><form id="login"><label for="email">邮箱 / 用户名</label><input id="email" type="email" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button>登录</button></form><form id="change" hidden><label for="current">当前密码</label><input id="current" type="password" autocomplete="current-password" required><label for="new-password">新密码（至少 12 位）</label><input id="new-password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required><button>保存新密码</button></form><p id="message" role="status"></p><a id="continue" href="/app.html" hidden>进入学习 →</a></section></main><footer>This website is owned by Ryan Run and is for non-commercial use only.</footer><script type="module" src="/login.js"></script><script type="module" src="/i18n.js"></script></html>
