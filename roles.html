<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts and roles · French with Ryan</title><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/brand.css?v=2"><header><a class="wordmark" href="/" data-i18n-skip><strong>French</strong> <em>with Ryan</em></a></header><main class="roles-page"><a href="/admin.html">学生管理</a><h1>账号与角色</h1><p>在此统一分配所有账号的角色。学生进度面板仅统计学生账号。</p><p class="role-description">学生：按授权学习 · 访客：学习及只读管理 · 老师：批改与查看进度 · 管理员：学生管理与批改</p><details class="admin-card role-create"><summary>添加账号</summary><form id="add-account" class="add-student-form"><label for="account-name">姓名</label><input id="account-name" maxlength="100"><label for="account-email">邮箱</label><input id="account-email" type="email" required><label for="account-role">角色</label><select id="account-role"><option value="student">学生</option><option value="guest">访客</option><option value="teacher">老师</option><option value="admin">管理员</option></select><button type="submit">创建账号</button></form></details><p id="role-message" role="status" style="white-space:pre-line"></p><section class="admin-card role-directory"><div class="role-directory-heading"><h2>现有账号</h2><span id="account-count" aria-live="polite"></span></div><div class="role-directory-tools"><label for="account-search">姓名 / 邮箱<input id="account-search" type="search" autocomplete="off"></label><label for="role-filter">角色<select id="role-filter"><option value="all">全部</option><option value="student">学生</option><option value="guest">访客</option><option value="teacher">老师</option><option value="admin">管理员</option><option value="owner">所有者</option></select></label></div><p>修改角色或停用账号会立即结束该账号的现有登录。所有者账号受保护。</p><div id="accounts"></div><p id="account-empty" hidden>没有匹配的账号。</p></section><a href="/app.html">返回学习空间</a></main><footer>This website is owned by Ryan Ren and is for non-commercial use only.</footer><script type="module" src="/roles.js"></script><script type="module" src="/i18n.js"></script></html>
